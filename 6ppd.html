<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6PPD transformations</title>
<style>
:root{--bg:#fff;--fg:#1c1c1a;--muted:#6b6b66;--line:#dcdcd4;--panel:#fff;--accent:#1d5fa8;--hl:#fff4e6;
--ev:rgba(255,214,0,.42);--chem:#c4ecca}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header span{color:var(--muted);font-size:14px}
header a{color:var(--accent)}
#scroll{overflow:auto;padding:8px 16px}
#map{position:relative}
#map svg{display:block;position:absolute;top:0;left:0}
#map .hit{fill:transparent;stroke:transparent;cursor:help;outline:none}
#map line.hit{stroke-width:14;pointer-events:stroke;stroke-linecap:round}
#map rect.hit{stroke-width:3;pointer-events:all}
#map rect.hit:hover,#map rect.hit:focus,#map rect.hit.active{fill:rgba(255,170,0,.18);stroke:rgba(255,150,0,.9)}
#map line.hit:hover,#map line.hit:focus,#map line.hit.active{stroke:rgba(255,170,0,.45)}
#pop{position:absolute;z-index:10;width:max-content;max-width:min(480px,calc(100vw - 16px));max-height:440px;overflow:auto;
background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px;line-height:1.5}
#pop[hidden]{display:none}
#pop h3{margin:0;font-size:15px}
#pop .kind{color:var(--muted);font-size:12px}
#pop h4{margin:10px 0 2px;font-size:13px}
#pop p{margin:4px 0}
#pop .note{color:var(--muted);font-size:13px}
#pop .struct{display:block;height:150px;width:100%;object-fit:scale-down;margin:6px 0 2px;background:#fff;border:1px solid var(--line);border-radius:6px}
#pop .smiles{color:var(--muted);font:11px ui-monospace,monospace;overflow-wrap:anywhere}
#pop .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
#pop .chips span,#pop .chips a{border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;text-decoration:none}
#pop .chips .species{font-style:italic}
#pop .chips a{color:var(--accent)}
#pop .chips a:hover,#pop .chips a:focus{background:var(--hl)}
#pop blockquote{margin:6px 0;padding:4px 8px;border-left:3px solid #e6c200;background:var(--ev);border-radius:0 4px 4px 0}
#pop blockquote a{display:block;margin-top:2px;font-size:12px;color:var(--accent);text-decoration:none}
#pop blockquote a:hover,#pop blockquote a:focus{text-decoration:underline}
#pop .none{color:var(--muted);font-size:13px}
</style>
</head>

<script type="application/json" id="pathway-data">{"id1a2b":{"title":"6PPD → hydroxy-6PPD","kind":"conversion","species":[],"notes":[],"sentences":[],"refs":[],"enzymes":[],"with":["with O3","also gives 1O2"]},"id3c4d":{"title":"hydroxy-6PPD → 6PPD-quinone","kind":"conversion","species":[],"notes":[],"sentences":[],"refs":[{"doi":"10.1126/science.abd6951","pmcid":"","url":"https://doi.org/10.1126/science.abd6951"}],"enzymes":[],"with":["with O3","also gives H2O2"]},"i5395e":{"title":"6PPD → 6QDI","kind":"conversion","species":[],"notes":["Oxidation with loss of two hydrogens (for example by persulfate); proposed as part of the route to the quinone. Also found in analytical standards of 6PPD."],"sentences":[{"id":"PMC12737381_e01","quote":"This method is based on the high oxidation potential of 6PPD, which, in the presence of potassium persulfate (K2S2O8), rapidly loses two electrons and two protons to form a red-colored oxidation product, N-1,3-dimethylbutyl-N’-phenylquinonediimine (6QDI).","pmcid":"PMC12737381","section":"4.5. Rapid Detection Method","url":"literature/PMC12737381.html#PMC12737381_e01"},{"id":"PMC13689822_e01","quote":"Both 6PPD and 7PPD standards used for the calibration curve had one of their oxidative transformation products detected, 6QDI (N-1,3-dimethyl-butyl-N′-phenyl quinone diamine) and 7QDI (N-1,4-dimethyl-pentyl-N′-phenyl quinone diamine), respectively.","pmcid":"PMC13689822","section":"3.2. 6PPD and 7PPD Calibration Adjustment","url":"literature/PMC13689822.html#PMC13689822_e01"},{"id":"PMC13689822_e02","quote":"The transformation of 6PPD into 6QDI as part of the quinone transformation route has been proposed.","pmcid":"PMC13689822","section":"3.2. 6PPD and 7PPD Calibration Adjustment","url":"literature/PMC13689822.html#PMC13689822_e02"}],"refs":[{"doi":"10.3390/toxics13121076","pmcid":"PMC12737381","url":"literature/PMC12737381.html"},{"doi":"10.1021/acs.est.6c07136","pmcid":"PMC13689822","url":"literature/PMC13689822.html"}],"enzymes":[],"with":[]},"i6bedd":{"title":"6PPD → cysteinyl-6PPD","kind":"conversion","species":["Caenorhabditis elegans"],"notes":["Via a glutathione conjugate that is broken down to the cysteine conjugate."],"sentences":[{"id":"PMC12288073_e02","quote":"These enzymatic reactions could convert 6PPD into multiple conjugates, including cysteinyl-6PPD (6DTP388, m/z 388.2046), 6PPD glucoside (6DTP431, m/z 431.2540), and 6PPD glucoside-6-phosphate (6DTP511, m/z 511.2204).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e02"},{"id":"PMC12288073_e04","quote":"Besides that, we also observed the formation of cysteine-conjugated 6PPD (6DTP388), where 6PPD presumably undergoes glutathione conjugation by GSTs at an electrophilic site, followed by sequential degradation via GGT and cysteinyl-glycine dipeptidase, akin to Cyprocide-B metabolism in C. elegans.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e04"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":["GST","GGT"],"with":[]},"i9f6e8":{"title":"6PPD → 6PPD N-glucoside","kind":"conversion","species":["Caenorhabditis elegans"],"notes":[],"sentences":[{"id":"PMC12288073_e02","quote":"These enzymatic reactions could convert 6PPD into multiple conjugates, including cysteinyl-6PPD (6DTP388, m/z 388.2046), 6PPD glucoside (6DTP431, m/z 431.2540), and 6PPD glucoside-6-phosphate (6DTP511, m/z 511.2204).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e02"},{"id":"PMC12288073_e03","quote":"Among them, 6DTP431 likely arises from UGT-mediated glycosylation at a secondary amine, while the two 6DTP511 isomers reflect phosphorylation of the glucoside conjugates at distinct amine sites by HKs, consistent with phosphoglucoside formation observed for genistein and albendazole in C. elegans.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e03"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":["UGT"],"with":[]},"iade98":{"title":"6PPD N-glucoside → 6PPD N-glucoside-6-phosphate","kind":"conversion","species":["Caenorhabditis elegans"],"notes":[],"sentences":[{"id":"PMC12288073_e02","quote":"These enzymatic reactions could convert 6PPD into multiple conjugates, including cysteinyl-6PPD (6DTP388, m/z 388.2046), 6PPD glucoside (6DTP431, m/z 431.2540), and 6PPD glucoside-6-phosphate (6DTP511, m/z 511.2204).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e02"},{"id":"PMC12288073_e03","quote":"Among them, 6DTP431 likely arises from UGT-mediated glycosylation at a secondary amine, while the two 6DTP511 isomers reflect phosphorylation of the glucoside conjugates at distinct amine sites by HKs, consistent with phosphoglucoside formation observed for genistein and albendazole in C. elegans.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e03"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":["HK"],"with":[]},"ib8b48":{"title":"6PPD → 4-HDPA","kind":"conversion","species":["Caenorhabditis elegans","Danio rerio"],"notes":["Hydrolysis; also abiotic in water."],"sentences":[{"id":"PMC12288073_e05","quote":"Similar pathways were noted for the hydrolysis product of 6PPD, 4-hydroxydiphenylamine (4-HDPA, 6DTP185, m/z 186.0913), yielding Phase II TPs including 4-HDPA glucoside (6DTP348, m/z 348.1441) and 4-HDPA glucoside-6-phosphate (6DTP428, m/z 428.1105).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e05"},{"id":"PMC12288073_e06","quote":"Analysis of medium-only controls confirmed the transformation of 6PPD to 4-HDPA in the culture solutions, which aligns with prior studies reporting significant abiotic conversion of 6PPD to 4-HDPA in aqueous environments and consistent detection of 4-HDPA in zebrafish embryo exposure media.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e06"},{"id":"PMC12737381_e02","quote":"Their study revealed that after 96 h of exposure to 6PPD in zebrafish embryos, biotransformation products accounted for 47% of the total peak area (TPA), with 4-hydroxydiphenylamine being the most abundant.","pmcid":"PMC12737381","section":"4.3. High-Resolution Mass Spectrometry (HRMS) Method","url":"literature/PMC12737381.html#PMC12737381_e02"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"},{"doi":"10.3390/toxics13121076","pmcid":"PMC12737381","url":"literature/PMC12737381.html"}],"enzymes":[],"with":[]},"ife916":{"title":"4-HDPA → 4-HDPA N-glucoside","kind":"conversion","species":["Caenorhabditis elegans"],"notes":[],"sentences":[{"id":"PMC12288073_e05","quote":"Similar pathways were noted for the hydrolysis product of 6PPD, 4-hydroxydiphenylamine (4-HDPA, 6DTP185, m/z 186.0913), yielding Phase II TPs including 4-HDPA glucoside (6DTP348, m/z 348.1441) and 4-HDPA glucoside-6-phosphate (6DTP428, m/z 428.1105).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e05"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":["UGT"],"with":[]},"i03fd1":{"title":"4-HDPA N-glucoside → 4-HDPA N-glucoside-6-phosphate","kind":"conversion","species":["Caenorhabditis elegans"],"notes":[],"sentences":[{"id":"PMC12288073_e05","quote":"Similar pathways were noted for the hydrolysis product of 6PPD, 4-hydroxydiphenylamine (4-HDPA, 6DTP185, m/z 186.0913), yielding Phase II TPs including 4-HDPA glucoside (6DTP348, m/z 348.1441) and 4-HDPA glucoside-6-phosphate (6DTP428, m/z 428.1105).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e05"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":["HK"],"with":[]},"i1921c":{"title":"6PPD-quinone → 2-hydroxy-5-phenylamino-1,4-quinone","kind":"conversion","species":["Caenorhabditis elegans","Homo sapiens","Rattus norvegicus","Oncorhynchus mykiss","Cyprinus carpio"],"notes":["In Homo sapiens, Rattus norvegicus, Oncorhynchus mykiss and Cyprinus carpio: in liver microsome incubations."],"sentences":[{"id":"PMC12288073_e10","quote":"Other Phase I TPs, including the hydrolysis (6QTP218, m/z 218.0812) and dehydrogenation product (6QTP297, m/z 297.1598), which were recently reported in the biotransformation pathways of 6PPD-Q in liver microsome incubations from humans, rats, rainbow trout, and common carp, were also identified in this study.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e10"},{"id":"PMC12288073_e11","quote":"Hydrolysis and reduction of the quinone carbonyl, potentially mediated by quinone reductase, produce 6QTP218 (m/z 218.0812), followed by hydroxylation on the benzene ring to form 6QTP317 (m/z 317.1860).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e11"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":[],"with":[]},"i1097d":{"title":"6PPD-quinone → monohydroxy 6PPD-Q","kind":"conversion","species":["Caenorhabditis elegans","Mus musculus","Oncorhynchus mykiss","Oncorhynchus kisutch"],"notes":["In Oncorhynchus mykiss: in liver cells (RTL-W1). In Oncorhynchus kisutch: suspected metabolite."],"sentences":[{"id":"PMC12288073_e07","quote":"Regarding 6PPD-Q, 26 TPs were identified in C. elegans extracts, including hydroxylated, methoxylated, glycosylated, and phosphorylated metabolites, which could be mediated by alcohol dehydrogenases (ADHs), cytochrome P450 enzymes (CYPs), O-methyltransferases (OMTs), UGTs, and other phosphorylases.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e07"},{"id":"PMC12288073_e08","quote":"The isomeric pattern of the monohydroxy 6PPD-Q (6QTP315), with RTs of 11.57, 13.12, and 14.09 min, reflects diverse hydroxylation sites, consistent with metabolites identified in mice and in rainbow trout liver cells (RTL-W1).","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e08"},{"id":"PMC10399305_e01","quote":"6PPD is expected to be highly bioaccumulative, and 6PPD-quinone and its suspected monohydroxylated metabolite can be detected in the brain and gills immediately after exposure that suggest compound uptake.","pmcid":"PMC10399305","section":"Embryonic Exposure to 6PPD-Quinone Induces Mortality and May Bioaccumulate in Hatched Alevin","url":"literature/PMC10399305.html#PMC10399305_e01"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"},{"doi":"10.1021/acs.est.3c01040","pmcid":"PMC10399305","url":"literature/PMC10399305.html"}],"enzymes":["CYP"],"with":[]},"i13d11":{"title":"monohydroxy 6PPD-Q → methoxy 6PPD-Q","kind":"conversion","species":["Caenorhabditis elegans","Oryza sativa","Homo sapiens"],"notes":["In Homo sapiens: in vitro."],"sentences":[{"id":"PMC12288073_e07","quote":"Regarding 6PPD-Q, 26 TPs were identified in C. elegans extracts, including hydroxylated, methoxylated, glycosylated, and phosphorylated metabolites, which could be mediated by alcohol dehydrogenases (ADHs), cytochrome P450 enzymes (CYPs), O-methyltransferases (OMTs), UGTs, and other phosphorylases.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e07"},{"id":"PMC12288073_e09","quote":"Moreover, the 6QTP315 isomers could undergo O-methylation to form methoxy 6PPD-Q (6QTP329, m/z 329.1860), as demonstrated in rice and human in vitro models.","pmcid":"PMC12288073","section":"Identification of Biotransformation Products of 6PPD and 6PPD-Q","url":"literature/PMC12288073.html#PMC12288073_e09"}],"refs":[{"doi":"10.1021/acs.est.5c02072","pmcid":"PMC12288073","url":"literature/PMC12288073.html"}],"enzymes":["OMT"],"with":[]},"iedcd3":{"title":"monohydroxy 6PPD-Q → hydroxy 6PPD-Q O-glucuronide","kind":"conversion","species":["Danio rerio"],"notes":["In embryos; more than 80% of the transformation products."],"sentences":[{"id":"PMC12737381_e03","quote":"Upon exposure to 6PPD-Q, over 95% was biotransformed, predominantly to 6PPD-Q + O + glucuronic acid, which contributed to more than 80% of TPA.","pmcid":"PMC12737381","section":"4.3. High-Resolution Mass Spectrometry (HRMS) Method","url":"literature/PMC12737381.html#PMC12737381_e03"}],"refs":[{"doi":"10.3390/toxics13121076","pmcid":"PMC12737381","url":"literature/PMC12737381.html"}],"enzymes":[],"with":[]},"idd029":{"title":"monohydroxy 6PPD-Q → dihydroxy 6PPD-Q","kind":"conversion","species":["Caenorhabditis elegans"],"notes":[],"sentences":[{"id":"PMC12288073_e12","quote":"A variety of Phase II TPs originating from monohydroxy and dihydroxy 6PPD-Q were also observed, including conjugates with pyrophosphate (6QTP395, m/z 395.1366; 6QTP411, m/z 411.1316), and glucoside (6QTP477, m/z 477.2231; <script>
const DATA = JSON.parse(document.getElementById('pathway-data').textContent);
const DEPICT = document.body.dataset.depict;
const map = document.getElementById('map'), pop = document.getElementById('pop');
// the page shows its own popup, so drop the plain SVG tooltips
map.querySelectorAll('.hit > title').forEach(t => t.remove());
let hideT, pinned = null, shown = null;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; return e; };
const link = (cls, text, url) => { const a = el('a', cls, text); a.href = url;
  if (/^https?:/.test(url)) { a.target = '_blank'; a.rel = 'noopener'; } return a; };
function show(shape){
  clearTimeout(hideT);
  const d = DATA[shape.dataset.id]; if (!d) return;
  if (shown) shown.classList.remove('active');
  shown = shape; shape.classList.add('active');
  pop.replaceChildren(el('h3', '', d.title), el('div', 'kind', d.markush ? d.kind + ', Markush structure' : d.kind));
  if (d.smiles) {            // 2D structure, drawn by CDK Depict from the (CX)SMILES
    const s = el('img', 'struct'); s.src = DEPICT + encodeURIComponent(d.smiles);
    s.alt = '2D structure of ' + d.title; pop.append(s, el('div', 'smiles', d.smiles));
  }
  if (d.xref) { const c = el('div', 'chips'); c.append(link('', d.xref.db + ' ' + d.xref.id, d.xref.url)); pop.append(c); }
  for (const t of d.with || []) pop.append(el('p', '', t));
  if (d.enzymes && d.enzymes.length) pop.append(el('p', '', 'Catalysed by ' + d.enzymes.join(', ')));
  if (d.catalyses) for (const t of d.catalyses) pop.append(el('p', '', 'Catalyses ' + t));
  for (const t of d.notes || []) pop.append(el('p', 'note', t));
  if (d.formed && d.formed.length) pop.append(el('p', 'note', 'Formed by: ' + d.formed.join('; ')));
  const metabolite = d.node && !d.catalyses;
  if (d.species.length) {
    pop.append(el('h4', '', metabolite ? 'Measured in' : 'Found in'));
    const c = el('div', 'chips'); for (const s of d.species) c.append(el('span', 'species', s)); pop.append(c);
  }
  if (d.sentences.length) {
    pop.append(el('h4', '', 'Supporting sentence' + (d.sentences.length > 1 ? 's' : '')));
    for (const s of d.sentences) {
      const q = el('blockquote', '', s.quote);
      q.append(link('', s.pmcid + (s.section ? ', ' + s.section : '') + ' ↗', s.url));
      pop.append(q);
    }
  }
  if (d.refs.length) {
    pop.append(el('h4', '', 'Reference' + (d.refs.length > 1 ? 's' : '')));
    const c = el('div', 'chips');
    for (const r of d.refs) c.append(link('', r.pmcid ? r.pmcid + ' (annotated article)' : 'doi:' + r.doi, r.url));
    pop.append(c);
  }
  if (!d.species.length && !d.sentences.length && !d.refs.length && !d.smiles && !(d.notes || []).length)
    pop.append(el('p', 'none', 'No further information in the pathway.'));
  pop.hidden = false; pop.scrollTop = 0;
  const r = shape.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
  let y = r.bottom + 6;
  if (y + h + 8 > innerHeight && r.top > h + 14) y = r.top - h - 6;
  pop.style.left = (x + scrollX) + 'px'; pop.style.top = (y + scrollY) + 'px';
}
function hideNow(){ pop.hidden = true; pinned = null; if (shown) shown.classList.remove('active'); shown = null; }
const hide = () => { if (!pinned) hideT = setTimeout(hideNow, 250); };
const target = e => e.target.closest ? e.target.closest('#map .hit') : null;
map.addEventListener('mouseover', e => { const s = target(e); if (s && !pinned) show(s); });
map.addEventListener('mouseout', e => { if (target(e)) hide(); });
map.addEventListener('focusin', e => { const s = target(e); if (s && !pinned) show(s); });
map.addEventListener('focusout', hide);
// a click keeps the popup open
map.addEventListener('click', e => { const s = target(e); if (!s) return; hideNow(); show(s); pinned = s; });
pop.addEventListener('mouseenter', () => clearTimeout(hideT));
pop.addEventListener('mouseleave', hide);
document.addEventListener('click', e => { if (!e.target.closest('#pop') && !target(e)) hideNow(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideNow(); });
</script>
